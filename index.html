<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>స్వీట్ బ్లాస్ట్ - అల్టిమేట్ పజిల్ గేమ్</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle, #ff6b6b, #c44569);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 26px;
            color: #f9ca24;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0;
            font-weight: bold;
            font-size: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 15px;
            touch-action: manipulation;
        }
        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            user-select: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .cell:hover {
            transform: scale(1.08);
            background: #fff;
        }
        .cell:active {
            transform: scale(0.9);
        }
        .cell.selected {
            background: #f9ca24;
            transform: scale(1.1);
            box-shadow: 0 0 15px #f9ca24;
        }
        .btn {
            background: linear-gradient(45deg, #f0932b, #eb4d4b);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.4);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 320px;
            width: 85%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: popUp 0.3s ease;
        }
        @keyframes popUp {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🍬 స్వీట్ బ్లాస్ట్ 🍭</h1>
    <p style="font-size: 12px; margin: 0; color: #f1f2f6;">3 లేదా అంతకంటే ఎక్కువ ఒకేలాంటి స్వీట్లను మ్యాచ్ చేయండి!</p>

    <div class="stats">
        <div>లెవెల్: <span id="level" style="color:#f9ca24;">1</span></div>
        <div>స్కోర్: <span id="score" style="color:#00d2d3;">0</span></div>
        <div>టార్గెట్: <span id="target" style="color:#ff6b81;">300</span></div>
    </div>

    <div class="board" id="gameBoard"></div>

    <button class="btn" onclick="spinWheel()">🎁 డైలీ స్పిన్ బోనస్</button>
</div>

<!-- విన్ / పాప్ అప్ -->
<div class="modal" id="popupModal">
    <div class="modal-content">
        <h2 id="modalTitle" style="color: #eb4d4b; margin-top:0;">అద్భుతం! 🎉</h2>
        <p id="modalText" style="font-size: 15px;">మీరు ఈ లెవెల్‌ని విజయవంతంగా దాటారు!</p>
        <button class="btn" onclick="nextLevel()">తదుపరి లెవెల్ 🚀</button>
    </div>
</div>

<script>
    const candies = ['🍬', '🍫', '🍩', '🍪', '🧁', '🍭'];
    const boardSize = 6;
    let board = [];
    let score = 0;
    let level = 1;
    let targetScore = 300;
    let selectedCell = null;

    const boardElement = document.getElementById('gameBoard');
    const scoreElement = document.getElementById('score');
    const levelElement = document.getElementById('level');
    const targetElement = document.getElementById('target');
    const popupModal = document.getElementById('popupModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');

    function initBoard() {
        board = [];
        boardElement.innerHTML = '';
        for (let r = 0; r < boardSize; r++) {
            let row = [];
            for (let c = 0; c < boardSize; c++) {
                let randomCandy = candies[Math.floor(Math.random() * candies.length)];
                row.push(randomCandy);
                
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.row = r;
                cell.dataset.col = c;
                cell.innerText = randomCandy;
                cell.addEventListener('click', handleCellClick);
                boardElement.appendChild(cell);
            }
            board.push(row);
        }
    }

    function handleCellClick() {
        const r = parseInt(this.dataset.row);
        const c = parseInt(this.dataset.col);

        if (!selectedCell) {
            selectedCell = { r, c };
            this.classList.add('selected');
        } else {
            const prevCell = document.querySelector(`[data-row='${selectedCell.r}'][data-col='${selectedCell.c}']`);
            if (prevCell) prevCell.classList.remove('selected');

            let diff = Math.abs(selectedCell.r - r) + Math.abs(selectedCell.c - c);
            if (diff === 1) {
                // స్వాప్ చేయండి
                let temp = board[selectedCell.r][selectedCell.c];
                board[selectedCell.r][selectedCell.c] = board[r][c];
                board[r][c] = temp;

                updateBoardUI();
                
                // మ్యాచ్ చెక్
                setTimeout(() => {
                    checkAndClearMatches();
                }, 200);
            }
            selectedCell = null;
        }
    }

    function updateBoardUI() {
        const cells = document.querySelectorAll('.cell');
        cells.forEach(cell => {
            let r = cell.dataset.row;
            let c = cell.dataset.col;
            cell.innerText = board[r][c];
        });
    }

    function checkAndClearMatches() {
        let matched = false;
        // హారిజాంటల్ మ్యాచ్ చెక్
        for (let r = 0; r < boardSize; r++) {
            for (let c = 0; c < boardSize - 2; c++) {
                if (board[r][c] === board[r][c+1] && board[r][c] === board[r][c+2]) {
                    matched = true;
                }
            }
        }

        if (matched) {
            score += 60 * level;
            scoreElement.innerText = score;
            
            // కొత్త క్యాండీలు పడటం
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    board[r][c] = candies[Math.floor(Math.random() * candies.length)];
                }
            }
            updateBoardUI();

            // టార్గెట్ రీచ్ అయితే నెక్స్ట్ లెవెల్ పాప్ అప్
            if (score >= targetScore) {
                showWinModal();
            }
        }
    }

    function showWinModal() {
        modalTitle.innerText = `లెవెల్ ${level} పూర్తయింది! 🌟`;
        modalText.innerText = `అద్భుతమైన స్కోర్ సాధించారు! తదుపరి లెవెల్‌కి వెళ్లండి.`;
        popupModal.style.display = 'flex';
    }

    function nextLevel() {
        level++;
        score = 0;
        targetScore += 200;
        levelElement.innerText = level;
        scoreElement.innerText = score;
        targetElement.innerText = targetScore;
        popupModal.style.display = 'none';
        initBoard();
    }

    function spinWheel() {
        let bonus = Math.random() > 0.5 ? 150 : 250;
        score += bonus;
        scoreElement.innerText = score;
        alert(`🎉 అదృష్టం బాగుంది! మీకు లక్కీ స్పిన్ బోనస్ +${bonus} పాయింట్లు వచ్చాయి!`);
        if (score >= targetScore) {
            showWinModal();
        }
    }

    initBoard();
</script>

</body>
</html>
